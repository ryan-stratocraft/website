  <body>
    <div id="oneura-bootstrap-splash" aria-hidden="true">
      <img src="/oneura-touch-icon.png" alt="" />
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var splash = document.getElementById('oneura-bootstrap-splash');
        if (!splash) return;
        var root = document.getElementById('root');
        if (!root) return;
        var hidden = false;
        function hide() {
          if (hidden) return;
          hidden = true;
          splash.classList.add('fading');
          setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 360);
        }
        var observer = new MutationObserver(function () {
          if (root.children.length > 0) {
            observer.disconnect();
            hide();
          }
        });
        observer.observe(root, { childList: true });
        setTimeout(hide, 5000);
      })();
    </script>
  </body>
